

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RopaStore | {% block title %}Panel de control{% endblock %}</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #20283b;
        }

        .layout { min-height: 100vh; }

        .main-area {
            padding: 32px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        .topbar h1 { font-size: 27px; }

        .user {
            background: white;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: bold;
        }

        .content {
            width: 100%;
        }

        .loading {
            display: none;
            color: #159879;
            padding: 10px;
        }

        .htmx-request .loading {
            display: block;
        }

        @media(max-width: 700px) {
            .main-area {
                padding: 20px 14px;
            }
            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>

    {% include "inventario/_sidebar_styles.html" %}
    {% block extra_css %}{% endblock %}
</head>

<body>
<div class="layout">

    {% include "inventario/_sidebar.html" %}

    <main class="main-area">

        <header class="topbar">
            <div>
                <h1>{% block page_title %}Panel de control{% endblock %}</h1>
                <p style="color:#7d8798; margin-top:7px;">
                    Sistema de gestión RopaStore
                </p>
            </div>

            <div class="user">Administrador</div>
        </header>

        <div id="contenido" class="content">
            {% block content %}{% endblock %}
        </div>

    </main>
</div>

</body>
</html>
