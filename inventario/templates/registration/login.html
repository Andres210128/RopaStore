<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | RopaStore</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #20283b;
        }
        main {
            width: min(100%, 420px);
            padding: 32px;
            border-radius: 14px;
            background: white;
            box-shadow: 0 3px 15px #18243a0a;
        }
        h1 { margin-bottom: 10px; }
        p { color: #64748b; }
        form { margin-top: 24px; }
        form p { margin-bottom: 16px; }
        label {
            display: block;
            margin-bottom: 7px;
            color: #344054;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dce1e9;
            border-radius: 8px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #159879;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .error { margin-top: 14px; color: #b91c1c; }
    </style>
</head>
<body>
    <main>
        <h1>RopaStore</h1>
        <p>Inicia sesión para acceder al sistema.</p>

        {% if form.errors %}
            <p class="error" role="alert">Usuario o contraseña incorrectos.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            <button type="submit">Iniciar sesión</button>
        </form>
    </main>
</body>
</html>
